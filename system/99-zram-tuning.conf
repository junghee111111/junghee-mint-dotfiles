# RAM 압축(ZRAM) 최적화 및 시스템 반응성 극대화 튜닝
# zram을 1순위로 적극 활용하도록 스와피니스 증가
vm.swappiness = 180

# 파일 시스템 메타데이터/디렉터리 캐시를 램에 오래 유지 (반응 속도 향상)
vm.vfs_cache_pressure = 50

# zram 전용 최적화: 한 번에 1페이지(4KB)씩 개별 압축/해제하여 지연 시간(레이턴시) 최소화
vm.page-cluster = 0

# 메모리 워터마크 부스트 비활성화 (스왑 스파이크 및 불필요한 일시정지 방지)
vm.watermark_boost_factor = 0

# 메모리 부족 시 버벅임 없이 선제적이고 부드러운 메모리 회수
vm.watermark_scale_factor = 125

# 더티 메모리 쓰기 비율 최적화
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10
